<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Call of Gruty</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0d10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg)}
#w{height:100%;display:flex;align-items:center;justify-content:center}
canvas{background:#222;width:min(100vw,160vh);width:min(calc(100vw - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)),calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*1.6));height:auto;max-width:none;max-height:none;aspect-ratio:8/5;cursor:crosshair;touch-action:none}
html:fullscreen,html:-webkit-full-screen{background:#000}
#rt{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#ffd400;font:13px Arial,sans-serif;padding:6px 12px;border-radius:14px;z-index:6;pointer-events:none;white-space:nowrap}
@media (orientation:portrait) and (pointer:coarse){#rt{display:block}}
html,body{overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#tc{display:none;position:fixed;inset:0;pointer-events:none;z-index:5;font-family:Impact,"Arial Black",sans-serif}
#tc>div{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
#tj{width:calc(128px*var(--k,1));height:calc(128px*var(--k,1));left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4)}
#tk{width:calc(54px*var(--k,1));height:calc(54px*var(--k,1));border-radius:50%;background:rgba(255,255,255,.5);pointer-events:none}
#ta,#tb{border:3px solid rgba(255,255,255,.7);font-size:15px;line-height:1.1;text-shadow:0 1px 3px #000}
#ta{width:calc(104px*var(--k,1));height:calc(104px*var(--k,1));right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));background:rgba(224,48,26,.5)}
#tb{width:calc(78px*var(--k,1));height:calc(78px*var(--k,1));right:calc(38px + 104px*var(--k,1) + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));background:rgba(60,170,220,.5)}
#tp{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:44px;height:44px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.6);font-size:15px;letter-spacing:-2px}
#tw{width:60px;height:60px;right:calc(48px + env(safe-area-inset-right,0px));bottom:calc(40px + 104px*var(--k,1) + env(safe-area-inset-bottom,0px));background:rgba(240,200,40,.45);border:3px solid rgba(255,255,255,.7);font-size:12px}
#ta.on{background:rgba(224,48,26,.9)}#tb.on{background:rgba(60,170,220,.9)}
#ak{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#111;color:#fff;border:2px solid #e0301a;padding:16px;z-index:9;font:16px Arial,sans-serif;text-align:center;border-radius:8px}
#ak input{display:block;margin:10px auto;font-size:18px;padding:6px;width:200px;text-align:center}#ak button{font-size:16px;margin:0 6px;padding:6px 14px}
</style></head><body><div id="w"><canvas id="c" width="800" height="500"></canvas></div>
